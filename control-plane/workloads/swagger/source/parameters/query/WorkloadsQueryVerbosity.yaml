name: verbosity
in: query
required: false
x-internal: true
description: |
  Response verbosity level. Defaults to full.
  slim reads the workloads table directly instead of the workloads view, so newly created workloads are returned immediately,
  and fills only id, name, type, projectId, projectName, clusterId and externalWorkloadName for each workload; the other fields are left empty.
  With slim, filterBy and sortBy accept only fields stored on the workload itself.
example: slim
schema:
  $ref: "../../schemas/Workloads/WorkloadVerbosity.yaml"
