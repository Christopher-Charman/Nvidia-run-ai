components:
  parameters:
    NotificationChannelName:
      description: Notification Channel name
      explode: false
      in: path
      name: name
      required: true
      schema:
        type: string
      style: simple
    SubscriptionId:
      description: Subscription id
      explode: false
      in: path
      name: id
      required: true
      schema:
        type: string
      style: simple
  responses:
    "401Unauthorized":
      content:
        application/json:
          example:
            code: 401
            message: Issuer is not familiar.
          schema:
            $ref: '#/components/schemas/Error'
      description: Unauthorized
    "403Forbidden":
      content:
        application/json:
          example:
            code: 403
            message: You do not have sufficient permissions.
          schema:
            $ref: '#/components/schemas/Error'
      description: Forbidden
    "404NotFound":
      content:
        application/json:
          example:
            code: 404
            message: Resource id not found.
          schema:
            $ref: '#/components/schemas/Error'
      description: The specified resource was not found
    "500InternalServerError":
      content:
        application/json:
          example:
            code: 500
            message: Something went wrong.
          schema:
            $ref: '#/components/schemas/Error'
      description: unexpected error
    "501NotImplemented":
      content:
        application/json:
          example:
            code: 501
            message: Not implemented
          schema:
            $ref: '#/components/schemas/Error'
      description: unexpected error
    "503ServiceUnavailable":
      content:
        application/json:
          example:
            code: 503
            message: Please try again in few minutes.
          schema:
            $ref: '#/components/schemas/Error'
      description: unexpected error
    "400BadRequest":
      content:
        application/json:
          example:
            code: 400
            message: Required parameter is missing
          schema:
            $ref: '#/components/schemas/Error'
      description: Bad request.
    "409Conflict":
      content:
        application/json:
          example:
            code: 409
            message: Resource with this name already exists
          schema:
            $ref: '#/components/schemas/Error'
      description: The specified resource already exists
  schemas:
    NotificationType:
      example:
        category: Workload status change
        type: Creating
        description: Workload and associated resources are being created in the cluster
      properties:
        category:
          type: string
        type:
          type: string
        description:
          type: string
      required:
      - category
      - description
      - type
      type: object
    NotificationTypes:
      items:
        $ref: '#/components/schemas/NotificationType'
      type: array
    Error:
      example:
        code: 400
        message: Bad request - Resource should have a name
      properties:
        code:
          maximum: 599
          minimum: 100
          type: integer
        message:
          type: string
        details:
          type: string
      required:
      - code
      - message
    NotificationState:
      example:
        enabled: false
      properties:
        enabled:
          default: false
          type: boolean
      type: object
    NotificationChannelMeta:
      example:
        name: my-email
        type: email
      properties:
        name:
          type: string
        type:
          default: email
          enum:
          - email
          - slack
          type: string
      required:
      - name
      - type
      type: object
    NotificationChannelType:
      default: email
      enum:
      - email
      - slack
      type: string
    EmailAuthType:
      default: auth_login
      enum:
      - auth_login
      - auth_plain
      - ""
      type: string
    EmailNotificationChannelConfig:
      example:
        username: email@gmail.com
        password: 123456
        smtpHost: smtp.gmail.com
        from: email@gmail.com
        subject: My subject
      properties:
        username:
          type: string
        password:
          type: string
        smtpHost:
          type: string
        from:
          type: string
        smtpPort:
          default: 587
          type: integer
        authType:
          $ref: '#/components/schemas/EmailAuthType'
        smtpTlsEnabled:
          nullable: true
          type: boolean
        recipients:
          default: []
          items:
            type: string
          type: array
        fromDisplayName:
          default: Run:ai
          type: string
        directNotifications:
          nullable: true
          type: boolean
        useAttachments:
          nullable: true
          type: boolean
        subject:
          default: "Run:ai notification - {{ .category }} {{ .reason }}"
          type: string
      type: object
    SlackNotificationChannelConfig:
      example:
        apiToken: xoxb-339636082819-8212861439062-F76IYDQCcoJtX1SeC8k3M
      properties:
        recipients:
          default: []
          items:
            type: string
          type: array
        directNotifications:
          nullable: true
          type: boolean
        apiToken:
          type: string
      type: object
    NotificationChannelConfig:
      oneOf:
      - $ref: '#/components/schemas/EmailNotificationChannelConfig'
      - $ref: '#/components/schemas/SlackNotificationChannelConfig'
      type: object
    NotificationChannelForPatch:
      example:
        type: email
        config: ""
      properties:
        type:
          $ref: '#/components/schemas/NotificationChannelType'
        config:
          allOf:
          - $ref: '#/components/schemas/NotificationChannelConfig'
      type: object
    NotificationChannel:
      allOf:
      - $ref: '#/components/schemas/NotificationChannelForPatch'
      - properties:
          name:
            type: string
        type: object
      example:
        name: name
        type: email
        config: ""
      required:
      - config
      - name
      - type
      type: object
    CreateSlackAppRequestBody:
      example:
        accessToken: xoxe.xoxp-1-Mi0yLTMzOTYzNjA4MjgxOS04MDI4MzM3NjUzNzQ2LTgyMDIzNzM1NTM5OTEtODMxNjcyNDM2MjY1OS03MjA4NmUzZGIyMTNlNjU5MjVjMDgzZTJmMTk1NWMzOWUwMGEyOGYzN2U1ZWYxYjA1ZjgxY2IzNDA5YThhMTAq
      properties:
        accessToken:
          description: The access token required for creating slack app
          type: string
      required:
      - accessToken
      type: object
    CreateSlackAppResponse:
      example:
        slackAppUrl: https://api.slack.com/apps/A089PHD5S0Q
      properties:
        slackAppUrl:
          type: string
      required:
      - slackAppUrl
      type: object
    NotificationChannelForValidate:
      allOf:
      - $ref: '#/components/schemas/NotificationChannelForPatch'
      example:
        type: email
        config: ""
      required:
      - config
      - type
      type: object
    SubscriptionEvent:
      properties:
        category:
          type: string
        types:
          items:
            type: string
          type: array
      required:
      - category
      - types
      type: object
    SubscriptionEvents:
      items:
        $ref: '#/components/schemas/SubscriptionEvent'
      type: array
    SubscriptionForPut:
      example:
        events:
        - category: cat1
          types:
          - type1
          - type2
        - category: cat2
          types:
          - type3
          - type4
        channels:
        - email
        - email1
      properties:
        events:
          items:
            $ref: '#/components/schemas/SubscriptionEvent'
          type: array
        channels:
          items:
            type: string
          type: array
      required:
      - channels
      - events
      type: object
    Subscription:
      allOf:
      - $ref: '#/components/schemas/SubscriptionForPut'
      - properties:
          id:
            type: string
        type: object
      example:
        id: 1234
        events:
        - category: cat1
          types:
          - type1
          - type2
        - category: cat2
          types:
          - type3
          - type4
        channels:
        - email
        - email1
      required:
      - channels
      - events
      type: object
    Subscriptions:
      items:
        $ref: '#/components/schemas/Subscription'
      type: array
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: Bearer authentication
      scheme: bearer
      type: http
