# Keeps every release-X.Y branch on the newest published KRM patch of the line
# its kai-version.yaml already pins, through a pull request left for review.
# main is bumped by hand, and so is moving any branch to a new KRM minor.

name: Nightly KRM Update

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Report the planned bumps without pushing or opening pull requests'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nightly-update-krm
  cancel-in-progress: false

env:
  GO_VERSION: "1.26.8"
  KRM_REPO: "kai-scheduler/kai-resource-management"
  KRM_CHART: "oci://ghcr.io/kai-scheduler/kai-resource-management/kai-resource-management"
  VERSION_FILE: "runai-cluster/kai-scheduler/kai-version.yaml"
  BOT_NAME: "github-actions[bot]"
  BOT_EMAIL: "github-actions[bot]@users.noreply.github.com"

jobs:
  branches:
    name: List target branches
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - name: List the release branches
        id: list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          targets="$(gh api "repos/$GITHUB_REPOSITORY/branches" --paginate --jq '.[].name' \
            | { grep -E '^release-[0-9]+\.[0-9]+$' || true; } \
            | jq -Rnc '[inputs]')"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  update-krm:
    name: Update KRM on ${{ matrix.target }}
    needs: branches
    if: needs.branches.outputs.targets != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.branches.outputs.targets) }}
    env:
      TARGET: ${{ matrix.target }}
      BRANCH: nightly/update-krm-${{ matrix.target }}
      DRY_RUN: ${{ inputs.dry-run || false }}
      # The tooling comes from the revision this workflow runs from, so a
      # release branch with an older or missing copy is updated the same way.
      UPDATE: ${{ github.workspace }}/tooling/runai-cluster/kai-scheduler/update-krm-version.sh
    defaults:
      run:
        working-directory: target
    steps:
      - name: Checkout tooling
        uses: actions/checkout@v5
        with:
          path: tooling
          persist-credentials: false

      - name: Checkout ${{ matrix.target }}
        uses: actions/checkout@v5
        with:
          ref: ${{ matrix.target }}
          path: target
          token: ${{ secrets.GIT_HUB_APPROVER_TOKEN }}

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Install yq
        working-directory: .
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -f "$VERSION_FILE" ]; then
            echo "::warning::$TARGET has no $VERSION_FILE; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          current="$(yq '.krm.chart-version' "$VERSION_FILE")"
          if [[ ! "$current" =~ ^v([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
            echo "::warning::$TARGET pins KRM '$current', which is not vX.Y.Z; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          line="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"

          latest="$(gh release list --repo "$KRM_REPO" --limit 100 \
            --exclude-drafts --exclude-pre-releases --json tagName --jq '.[].tagName' \
            | { grep -E "^${line//./\\.}\.[0-9]+$" || true; } | sort -V | tail -n1)"
          echo "$TARGET pins KRM $current; newest published $line release: ${latest:-none}"
          if [ -z "$latest" ] || [ "$(printf '%s\n' "$current" "$latest" | sort -V | tail -n1)" = "$current" ]; then
            echo "$TARGET is up to date."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A GitHub release can land before its chart is pushed; retry next run.
          if ! helm show chart "$KRM_CHART" --version "$latest" >/dev/null; then
            echo "::notice::The KRM $latest chart is not published yet; leaving $TARGET for the next run."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          title="[$TARGET] chore(deps): update KRM to $latest"

          open="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --base "$TARGET" \
            --state open --json number --jq '.[0].number // ""')"
          if [ -n "$open" ]; then
            pr="$(gh pr view "$open" --repo "$GITHUB_REPOSITORY" --json title,headRefOid,commits)"
            if [ "$(jq -r .title <<<"$pr")" = "$title" ]; then
              echo "Pull request #$open already carries KRM $latest."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # Updating the pull request replaces its branch, so it must hold
            # nothing but the bot's own commits.
            if ! jq -e --arg name "$BOT_NAME" --arg email "$BOT_EMAIL" \
                'all(.commits[].authors[]; .name == $name and .email == $email)' <<<"$pr" >/dev/null; then
              echo "::warning::Pull request #$open has commits from someone other than the bot; leaving it for a maintainer."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            head="$(jq -r .headRefOid <<<"$pr")"
          else
            head="$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)"
          fi

          {
            echo "skip=false"
            echo "current=$current"
            echo "latest=$latest"
            echo "title=$title"
            echo "number=$open"
            echo "head=$head"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Go
        if: steps.plan.outputs.skip == 'false'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Apply
        id: apply
        if: steps.plan.outputs.skip == 'false'
        env:
          LATEST: ${{ steps.plan.outputs.latest }}
          GOPRIVATE: "github.com/run-ai/*,github.com/dsx-ai-factory/*,github.com/kai-scheduler/*"
          # Scoped to this step through the environment, so the push below
          # still authenticates as the checkout token rather than GITHUB_TOKEN.
          GIT_CONFIG_COUNT: "2"
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.GIT_HUB_OSS }}@github.com/run-ai/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/run-ai/
          GIT_CONFIG_KEY_1: url.https://x-access-token:${{ github.token }}@github.com/dsx-ai-factory/.insteadOf
          GIT_CONFIG_VALUE_1: https://github.com/dsx-ai-factory/
        run: |
          set -euo pipefail
          RUNAI_REPO_ROOT="$PWD" "$UPDATE" "$LATEST"
          git status --short
          if git diff --quiet; then
            echo "::warning::Updating $TARGET to KRM $LATEST changed no files."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open pull request
        if: steps.apply.outputs.changed == 'true' && env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ secrets.GIT_HUB_APPROVER_TOKEN }}
          CURRENT: ${{ steps.plan.outputs.current }}
          LATEST: ${{ steps.plan.outputs.latest }}
          TITLE: ${{ steps.plan.outputs.title }}
          NUMBER: ${{ steps.plan.outputs.number }}
          HEAD: ${{ steps.plan.outputs.head }}
        run: |
          set -euo pipefail
          git config --local user.name "$BOT_NAME"
          git config --local user.email "$BOT_EMAIL"
          git switch -C "$BRANCH"
          git add -A
          git commit -s -m "$TITLE"
          # Fails if anything reached the branch since the plan checked it.
          git push --force-with-lease="refs/heads/$BRANCH:$HEAD" -u origin "$BRANCH"

          kai="$(yq '.kai.human-readable-version' "$VERSION_FILE")"
          BODY="$RUNNER_TEMP/pr-body.md"
          {
            echo "Automated by the **Nightly KRM Update** workflow, via \`runai-cluster/kai-scheduler/update-krm-version.sh\`."
            echo
            echo "- \`kai-resource-management\` chart: \`$CURRENT\` → \`$LATEST\`"
            echo "- KAI Scheduler Go module and \`kai-version.yaml\`: \`$kai\`, the version KRM $LATEST bundles"
          } > "$BODY"

          if [ -n "$NUMBER" ]; then
            gh pr edit "$NUMBER" --title "$TITLE" --body-file "$BODY"
          else
            gh pr create --base "$TARGET" --head "$BRANCH" --title "$TITLE" --body-file "$BODY"
          fi
