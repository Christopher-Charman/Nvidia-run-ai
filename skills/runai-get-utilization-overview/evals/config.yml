schema_version: 1

# Route-out cases expect the agent to pick a sibling Run:ai skill, so every
# arm gets the siblings installed, as a user of the catalog would.
skill_workspace:
  mode: group
  include:
    - runai-audit-assigned-quota
    - runai-diagnose-failed-workload
    - runai-get-cluster-health-summary
    - runai-get-workload-health-summary
