# Derived from test/testdata/golden/07-phase1-modelrewrite.yaml. One InferenceModelRewrite per endpoint, one rule per
# rewrite. The EPP watches this object at runtime, so changes apply without a restart.
{{- if .Rewrites }}
apiVersion: inference.networking.x-k8s.io/v1alpha2
kind: InferenceModelRewrite
metadata:
  name: {{ .Name }}-rewrite
  namespace: {{ .Namespace }}
spec:
  poolRef:
    group: inference.networking.k8s.io
    kind: InferencePool
    name: {{ .Name }}-pool
  rules:
{{- range .Rewrites }}
  - matches:
    - model:
        type: Exact
        value: {{ .Model }}
    targets:
{{- range .Targets }}
    - modelRewrite: {{ .Model }}
      weight: {{ .Weight }}
{{- end }}
{{- end }}
{{- end }}
