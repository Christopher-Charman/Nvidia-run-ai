# Derived from test/testdata/golden/05-httproute.yaml. Type is upstream Gateway API, the instance is ours.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Name }}-route
  namespace: {{ .Namespace }}
spec:
  parentRefs:
  - name: {{ .GatewayName }}          # admin's Gateway, referenced by name only
    namespace: {{ .GatewayNamespace }}
  hostnames:
{{- range .Hostnames }}
  - {{ . }}
{{- end }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /v1
{{- if .RuntimeProfiles }}
    filters:
    - type: RequestHeaderModifier
      requestHeaderModifier:
        set:
        - name: EPP-Profile
          value: {{ printf "%q" .ActiveProfile }}
{{- end }}
    backendRefs:
    - group: inference.networking.k8s.io
      kind: InferencePool
      name: {{ .Name }}-pool
    timeouts:
      request: 300s
