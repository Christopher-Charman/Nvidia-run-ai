# Derived from test/testdata/golden/03-inferencepool.yaml. Type is upstream GIE, the instance is ours.
apiVersion: inference.networking.k8s.io/v1
kind: InferencePool
metadata:
  name: {{ .Name }}-pool
  namespace: {{ .Namespace }}
spec:
  selector:
    matchLabels:
{{- range $k, $v := .Selector }}
      {{ printf "%q" $k }}: {{ printf "%q" $v }}
{{- end }}
  targetPorts:
  - number: {{ .Port }}
  appProtocol: http
  endpointPickerRef:
    name: {{ .Name }}-epp
    port:
      number: 9002                    # agentgateway requires the port to be explicit
{{- if .RuntimeProfiles }}
    failureMode: FailClose            # never silently bypass the selected scheduling profile
{{- else }}
    failureMode: FailOpen             # if the EPP is down, fall back to plain routing instead of 5xx
{{- end }}
