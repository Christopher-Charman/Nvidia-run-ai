    ClusterReportedStatus_conditions_inner:
      description: Condition contains details for one aspect of the current state
        of this API Resource
      properties:
        lastTransitionTime:
          description: "lastTransitionTime is the last time the condition transitioned\
            \ from one status to another. This should be when the underlying condition\
            \ changed.  If that is not known, then using the time when the API field\
            \ changed is acceptable."
          format: date-time
          type: string
        message:
          description: message is a human readable message indicating details about
            the transition. This may be an empty string.
          maxLength: 32768
          type: string
        observedGeneration:
          description: "observedGeneration represents the .metadata.generation that\
            \ the condition was set based upon. For instance, if .metadata.generation\
            \ is currently 12, but the .status.conditions[x].observedGeneration is\
            \ 9, the condition is out of date with respect to the current state of\
            \ the instance."
          format: int64
          minimum: 0
          type: integer
        reason:
          description: "reason contains a programmatic identifier indicating the reason\
            \ for the condition's last transition. Producers of specific condition\
            \ types may define expected values and meanings for this field, and whether\
            \ the values are considered a guaranteed API. The value should be a CamelCase\
            \ string. This field may not be empty."
          maxLength: 1024
          minLength: 1
          pattern: "^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$"
          type: string
        status:
          description: "status of the condition, one of True, False, Unknown."
          enum:
          - "True"
          - "False"
          - Unknown
          type: string
        type:
          description: "type of condition in CamelCase or in foo.example.com/CamelCase.\
            \ --- Many .condition.type values are consistent across resources like\
            \ Available, but because arbitrary conditions can be useful (see .node.status.conditions),\
            \ the ability to deconflict is important. The regex it matches is (dns1123SubdomainFmt/)?(qualifiedNameFmt)"
          maxLength: 316
          type: string
      required:
      - lastTransitionTime
      - message
      - reason
      - status
      - type
      type: object
    ClusterReportedStatus_operands_value:
      description: "Status specifies the status of an operand. And operand manages\
        \ resources, some of which are not immediately available and need their status\
        \ monitored, such as Deployments, Daemonsets, Ingressess etc. Some resources\
        \ are immediately available and should not be monitored once accepted by the\
        \ cluster, such as Services, ConfigMaps, Secrets etc. If all resources of\
        \ an operand are ready, a Status with Ready set to 'true' and a nil 'Reasons'\
        \ slice should be returned, otherwise, a Status with 'Reasons' slice containig\
        \ the reason why the Operand is not ready (Deployment pods are not ready for\
        \ example.)"
      properties:
        lastTransitionTime:
          description: LastTransitionTime specifies the last time the operand readiness
            changed
          format: date-time
          type: string
        ready:
          description: Ready specifies if the operand is ready or not
          type: boolean
        reasons:
          description: Reasons specifies the reasons why the operand is not ready
          items:
            type: string
          type: array
        unreadyThresholdCrossed:
          description: UnreadyThresholdCrossed specifies if the operand has been unready
            for longer than the threshold
          type: boolean
      required:
      - ready
      type: object
    ClusterReportedStatus_platform:
