  /api/v1/clusters/{clusterUuid}/nodes:
    get:
      description: Retrieve a list of nodes from the Kubernetes cluster.
      operationId: get_nodes
      parameters:
      - description: The Universally Unique Identifier (UUID) of the cluster.
        explode: false
        in: path
        name: clusterUuid
        required: true
        schema:
          example: 9f55255e-11ed-47c7-acef-fc4054768dbc
          format: uuid
          minLength: 1
          type: string
        style: simple
      - description: "Deprecated - use filterBy instead. The node name; Cannot be\
          \ used together with filterBy, sort, offset, limit or search query params."
        explode: true
        in: query
        name: nodeName
        required: false
        schema:
          type: string
        style: form
      - description: "Filter results by a parameter. Use the format field-name operator\
          \ value. Operators are == Equals, != Not equals, <= Less than or equal,\
          \ >= Greater than or equal, =@ contains, !@ Does not contains, =^ Starts\
          \ with and =$ Ends with. Dates are in ISO 8601 timestamp format and available\
          \ for operators ==, !=, <= and >=."
        explode: false
        in: query
        name: filterBy
        required: false
        schema:
          example:
          - name!=some-name
          items:
            pattern: ^(name|status|nodePool|gpuType|nvLinkDomainUid|nvLinkCliqueId)(==|!=|<=|>=|=@|!@|=\^|=\$).+$
            type: string
          type: array
        style: form
      - description: Sort results by a parameters.
        explode: true
        in: query
        name: sortBy
        required: false
        schema:
          $ref: '#/components/schemas/NodeFilterSortFields'
        style: form
      - description: Sort results in descending or ascending order.
        explode: true
        in: query
        name: sortOrder
        required: false
        schema:
          default: asc
          enum:
          - asc
          - desc
          type: string
        style: form
      - description: The offset of the first item returned in the collection.
        explode: true
        in: query
        name: offset
        required: false
        schema:
          example: 100
          format: int32
          type: integer
        style: form
      - description: The maximum number of entries to return.
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 50
          format: int32
          maximum: 500
          minimum: 1
          type: integer
        style: form
      - description: Filter results by a free text search.
        explode: true
        in: query
        name: search
        required: false
        schema:
          example: test project
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Nodes'
          description: Executed successfully.
        "401":
          content:
            application/json:
              example:
                code: 401
                message: Issuer is not familiar.
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized
        "403":
          content:
            application/json:
              example:
                code: 403
                message: You do not have sufficient permissions.
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
        "404":
          content:
            application/json:
              example:
                code: 404
                message: Resource id not found.
              schema:
                $ref: '#/components/schemas/Error'
          description: The specified resource was not found
        "500":
          content:
            application/json:
              example:
                code: 500
                message: Something went wrong.
              schema:
                $ref: '#/components/schemas/Error'
          description: unexpected error
        "503":
          content:
            application/json:
              example:
                code: 503
                message: Please try again in few minutes.
              schema:
                $ref: '#/components/schemas/Error'
          description: unexpected error
      summary: Get a list of nodes.
      tags:
      - Nodes
      x-runai-team: Suricata
      x-test-coverage:
      - src/test/suites/advancedSuite/nodes/nodesStatuses.test.ts
      - src/test/suites/advancedSuite/dashboardsV2/SanityTelemetryApi.test.ts
      x-authorize:
