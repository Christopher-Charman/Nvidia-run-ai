      - description: Sort results in descending or ascending order.
        explode: true
        in: query
        name: sortOrder
        required: false
        schema:
          default: asc
          enum:
          - asc
          - desc
          type: string
        style: form
      - description: The offset of the first item returned in the collection.
        explode: true
        in: query
        name: offset
        required: false
        schema:
          example: 100
          format: int32
          type: integer
        style: form
      - description: The maximum number of entries to return.
        explode: true
