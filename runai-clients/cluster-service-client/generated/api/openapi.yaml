        required: false
        schema:
          example:
          - name!=some-name
          items:
            pattern: ^(name|clusterId|phase|createdAt|updatedAt|gpuNetworkAccelerationDetection|gpuNetworkAccelerationDetected|gpuNetworkAccelerationLabelKey|swapEnabled|nodeLevelSchedulerEnabled)(==|!=|<=|>=|=@|!@|=\^|=\$).+$
