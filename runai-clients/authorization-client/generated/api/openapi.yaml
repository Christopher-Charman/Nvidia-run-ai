openapi: 3.0.3
info:
  contact:
    email: support@run.ai
    name: Run.AI
    url: https://www.run.ai/
  description: An API for managing RunAi authorization objects and perform as the
    RunAi authorization layer.
  title: Authorization
  version: "1.0"
servers:
- url: https://app.run.ai
- url: https://staging.run.ai
- url: https://test.run.ai
- url: http://localhost:8080
security:
- bearerAuth: []
paths:
  /:
    get:
      operationId: health
      responses:
        "200":
          description: Executed successfully.
      summary: health check
      tags:
      - Health
      x-no-authorization: true
      x-test-coverage: not-applicable
      x-runai-team: Suricata
    x-internal: true
    x-runai-team: Suricata
  /api/v1/authorization/roles:
    get:
      description: Use to retrieve a list of roles.
      operationId: get_roles_v1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Roles'
          description: Executed successfully.
        "400":
          content:
            application/json:
              example:
                code: 400
                message: Required parameter is missing
              schema:
                $ref: '#/components/schemas/Error'
          description: Bad request.
        "401":
          content:
            application/json:
              example:
                code: 401
                message: Issuer is not familiar.
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized
        "403":
          content:
            application/json:
              example:
                code: 403
                message: You do not have sufficient permissions.
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
        "500":
          content:
            application/json:
              example:
                code: 500
                message: Something went wrong.
              schema:
                $ref: '#/components/schemas/Error'
          description: unexpected error
        "503":
          content:
            application/json:
              example:
                code: 503
                message: Please try again in few minutes.
              schema:
                $ref: '#/components/schemas/Error'
          description: unexpected error
      summary: Get a list of roles.
      tags:
      - Roles
      x-runai-team: Suricata
      x-test-coverage:
      - e2e/src/test/suites/advancedSuite/permissions/applicationAggregatedApi.test.ts
      - e2e/src/test/suites/advancedSuite/permissions/accessRulesApi.test.ts
      x-authorize:
        resource-type: roles
        action: read
  /api/v1/authorization/roles/{roleIdPath}:
    get:
      description: Retrieve the details of a role by id.
      operationId: get_role_v1
      parameters:
      - description: The id of the role to retrieve
        example: 32
        explode: false
        in: path
        name: roleIdPath
        required: true
        schema:
          format: int32
          minimum: 0
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
          description: Executed successfully.
        "400":
          content:
            application/json:
              example:
                code: 400
                message: Required parameter is missing
              schema:
                $ref: '#/components/schemas/Error'
          description: Bad request.
        "401":
          content:
            application/json:
              example:
                code: 401
                message: Issuer is not familiar.
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized
        "403":
          content:
            application/json:
              example:
                code: 403
                message: You do not have sufficient permissions.
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
        "404":
          content:
            application/json:
              example:
                code: 404
                message: Resource id not found.
              schema:
                $ref: '#/components/schemas/Error'
          description: The specified resource was not found
        "500":
          content:
            application/json:
              example:
                code: 500
                message: Something went wrong.
              schema:
                $ref: '#/components/schemas/Error'
          description: unexpected error
        "503":
          content:
            application/json:
              example:
                code: 503
                message: Please try again in few minutes.
              schema:
                $ref: '#/components/schemas/Error'
          description: unexpected error
