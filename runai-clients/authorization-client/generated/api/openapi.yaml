  /api/v1/authorization/access-rules:
    get:
      description: Retrieve a list of access rules.
      operationId: get_access_rules
      parameters:
      - description: The type of resource we want to filter by.
        explode: true
        in: query
        name: subjectType
        required: false
        schema:
          example: user
          type: string
        style: form
      - deprecated: true
        description: Part of the subject id that we want to filter by.
        explode: true
        in: query
        name: subjectIdFilter
        required: false
        schema:
          example: some.user
          type: string
        style: form
      - description: The ids of the subjects to filter the response for.
        explode: false
        in: query
        name: subjectIds
        required: false
        schema:
          items:
            example: some.user@run.ai
            type: string
          type: array
        style: form
      - description: The maximum number of entries to return.
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 50
          format: int32
          maximum: 500
          minimum: 1
          type: integer
        style: form
      - description: The offset of the first item returned in the collection.
        explode: true
        in: query
        name: offset
        required: false
        schema:
          example: 100
          format: int32
          type: integer
        style: form
      - description: Filter by last update time.
        explode: true
        in: query
        name: lastUpdated
        required: false
        schema:
          example: 2021-12-14T16:04:15.099Z
          type: string
        style: form
      - description: True to include deleted objects in the result.
        explode: true
        in: query
        name: includeDeleted
        required: false
        schema:
          default: false
          example: false
          type: boolean
        style: form
      - description: Filter using the Universally Unique Identifier (UUID) of the
          cluster.
        explode: true
        in: query
        name: clusterId
        required: false
        schema:
          example: d73a738f-fab3-430a-8fa3-5241493d7128
          format: uuid
          type: string
        style: form
      - deprecated: true
        description: The type of resource we want to filter by.
        explode: true
        in: query
        name: scopeType
        required: false
        schema:
          example: project
          type: string
        style: form
      - description: The scope resource id that we want to filter by.
        explode: true
        in: query
        name: scopeId
        required: false
        schema:
          example: "2"
          type: string
        style: form
      - deprecated: true
        description: The role id we want to filter by.
        explode: true
        in: query
        name: roleId
        required: false
        schema:
          format: int32
          minimum: 1
          type: integer
        style: form
      - description: Sort results in descending or ascending order.
        explode: true
        in: query
        name: sortOrder
        required: false
        schema:
          default: asc
          enum:
          - asc
          - desc
          type: string
        style: form
      - description: Sort results by a parameter.
        explode: true
        in: query
        name: sortBy
        required: false
        schema:
          $ref: '#/components/schemas/AccessRulesSortFilterFields'
        style: form
      - description: "Filter results by a parameter. Use the format field-name operator\
          \ value. Operators are == Equals, != Not equals, <= Less than or equal,\
          \ >= Greater than or equal, =@ contains, !@ Does not contains, =^ Starts\
          \ with and =$ Ends with. Dates are in ISO 8601 timestamp format and available\
          \ for operators ==, !=, <= and >=."
        example:
        - name!=some-access-rule-name
        - createdAt>=2023-01-01T00:00:00Z
        explode: false
        in: query
        name: filterBy
        required: false
        schema:
          items:
            pattern: ^(subjectId|subjectType|roleId|scopeId|scopeType|roleName|scopeName|createdAt|deletedAt|createdBy|phase)(==|!=|<=|>=|=@|!@|=\^|=\$).+$
            type: string
          type: array
        style: form
      - description: Filter results by a free text search.
        explode: true
        in: query
        name: search
        required: false
        schema:
          example: test project
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/get_access_rules_200_response'
          description: Executed successfully.
        "401":
          content:
            application/json:
              example:
                code: 401
                message: Issuer is not familiar.
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized
        "403":
          content:
            application/json:
              example:
                code: 403
                message: You do not have sufficient permissions.
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
        "500":
          content:
            application/json:
              example:
                code: 500
                message: Something went wrong.
              schema:
                $ref: '#/components/schemas/Error'
          description: unexpected error
        "503":
          content:
            application/json:
              example:
