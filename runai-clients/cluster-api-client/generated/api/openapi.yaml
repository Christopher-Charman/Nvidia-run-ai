openapi: 3.0.3
info:
  contact:
    email: support@run.ai
  description: An API for proxying k8s commands on workloads.
  title: Cluster API
  version: 1.0.0
servers:
- url: https://app.run.ai
- url: https://staging.run.ai
- url: https://test.run.ai
security:
- bearerAuth: []
paths:
  /health:
    get:
      operationId: health
      responses:
        "200":
          description: Executed successfully.
      summary: health check
      tags:
      - Health
      x-no-authorization: true
      x-runai-team: Fox
    x-internal: true
  /cluster-api/status:
    get:
      operationId: status
      responses:
        "200":
          description: Executed successfully.
      summary: status check
      tags:
      - Status
      x-no-authorization: true
      x-runai-team: Fox
    x-internal: true
  /cluster-api/api/v1/{projectName}/workloads/{workloadType}/{workloadFramework}/{workloadName}/status:
    get:
      description: Get the status of a workload
      operationId: get_workload_status
      parameters:
      - description: The project name
        example: project1
        explode: false
        in: path
        name: projectName
        required: true
        schema:
          type: string
        style: simple
      - description: The workload type
        explode: false
        in: path
        name: workloadType
        required: true
        schema:
          enum:
          - workspace
          - training
          - distributed
          type: string
        style: simple
      - description: The workload name
        example: jp
        explode: false
        in: path
        name: workloadName
        required: true
        schema:
          type: string
        style: simple
      - description: The workload framework
        explode: false
        in: path
        name: workloadFramework
        required: true
        schema:
          enum:
          - runai
          - mpi
          - pytorch
          - tf
          - xgboost
          - any
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkloadStatus'
          description: OK
        "400":
          content:
            application/json:
              example:
                code: 400
                message: Required parameter is missing
              schema:
                $ref: '#/components/schemas/Error'
          description: Bad request.
        "401":
          content:
            application/json:
              example:
                code: 401
                message: Issuer is not familiar.
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized
        "403":
          content:
            application/json:
              example:
                code: 403
                message: You do not have sufficient permissions.
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
        "404":
          content:
            application/json:
              example:
                code: 404
                message: Resource id not found.
              schema:
                $ref: '#/components/schemas/Error'
          description: The specified resource was not found
        "500":
          content:
            application/json:
              example:
                code: 500
                message: Something went wrong.
              schema:
                $ref: '#/components/schemas/Error'
          description: unexpected error
        "503":
          content:
            application/json:
              example:
                code: 503
                message: Please try again in few minutes.
              schema:
                $ref: '#/components/schemas/Error'
          description: unexpected error
      summary: Get the status of a workload
      tags:
      - Cluster API
      x-runai-team: Fox
      x-no-authorization: true
components:
  parameters:
    ProjectName:
      description: The project name
      example: project1
      explode: false
      in: path
      name: projectName
      required: true
      schema:
        type: string
      style: simple
    WorkloadType:
      description: The workload type
      explode: false
      in: path
      name: workloadType
      required: true
      schema:
        enum:
        - workspace
        - training
        - distributed
        type: string
      style: simple
    WorkloadName:
      description: The workload name
      example: jp
      explode: false
      in: path
      name: workloadName
      required: true
      schema:
        type: string
      style: simple
    WorkloadFramework:
      description: The workload framework
      explode: false
      in: path
      name: workloadFramework
      required: true
      schema:
        enum:
        - runai
        - mpi
        - pytorch
        - tf
        - xgboost
        - any
        type: string
      style: simple
  responses:
    "400BadRequest":
      content:
        application/json:
          example:
            code: 400
            message: Required parameter is missing
          schema:
            $ref: '#/components/schemas/Error'
      description: Bad request.
    "401Unauthorized":
      content:
        application/json:
          example:
            code: 401
            message: Issuer is not familiar.
          schema:
            $ref: '#/components/schemas/Error'
      description: Unauthorized
    "403Forbidden":
      content:
        application/json:
          example:
            code: 403
            message: You do not have sufficient permissions.
          schema:
            $ref: '#/components/schemas/Error'
      description: Forbidden
    "404NotFound":
      content:
        application/json:
          example:
            code: 404
            message: Resource id not found.
          schema:
            $ref: '#/components/schemas/Error'
      description: The specified resource was not found
    "500InternalServerError":
      content:
        application/json:
          example:
            code: 500
            message: Something went wrong.
          schema:
            $ref: '#/components/schemas/Error'
      description: unexpected error
    "503ServiceUnavailable":
      content:
        application/json:
          example:
            code: 503
            message: Please try again in few minutes.
          schema:
            $ref: '#/components/schemas/Error'
      description: unexpected error
  schemas:
    WorkloadStatus:
      example:
        status: Creating
      properties:
        status:
          description: Status of a workload
          enum:
          - Creating
          - Initializing
          - Running
          - Degraded
          - Pending
          - Stopped
          - Completed
          - Failed
          - Terminating
          - Unknown
          type: string
      type: object
    Error:
      example:
        code: 400
        message: Bad request - Resource should have a name
      properties:
        code:
          maximum: 599
          minimum: 100
          type: integer
        message:
          type: string
        details:
          type: string
      required:
      - code
      - message
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: Bearer authentication
      scheme: bearer
      type: http
