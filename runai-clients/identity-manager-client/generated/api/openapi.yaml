components:
  parameters:
    idp:
      description: The alias of the idp
      explode: false
      in: path
      name: idp
      required: true
      schema:
        type: string
      style: simple
    usersFilterBy:
      description: "Filter results by a parameter. Use the format field-name operator\
        \ value. Operators are <= Less than or equal, >= Greater than or equal, =@\
        \ contains. Dates are in ISO 8601 timestamp format and available for operators\
        \ <=, >= and ==."
      explode: false
      in: query
      name: filterBy
      required: false
      schema:
        example:
        - "username=@test,lastLogin>=2024-09-24T00:00:00.00Z,isLocal==false"
        items:
          pattern: ^(username|createdBy|lastLogin|creationTime|lastUpdated|isLocal)(==|<=|>=|=@).+$
          type: string
        type: array
      style: form
    usersSortBy:
      description: Sort results by a parameters.
      explode: true
      in: query
      name: sortBy
      required: false
      schema:
        $ref: '#/components/schemas/UsersFilterSortFields'
      style: form
    SortOrder:
      description: Sort results in descending or ascending order.
      explode: true
      in: query
      name: sortOrder
      required: false
      schema:
        default: asc
        enum:
        - asc
        - desc
        type: string
      style: form
    Offset:
      description: The offset of the first item returned in the collection.
      explode: true
      in: query
      name: offset
      required: false
      schema:
        example: 100
        format: int32
        type: integer
      style: form
    limit:
      description: The maximum number of entries to return.
      explode: true
      in: query
      name: limit
      required: false
      schema:
        default: 500
        format: int32
        maximum: 500
        minimum: 1
        type: integer
      style: form
    search:
      description: Filter results by a free text search.
      explode: true
      in: query
      name: search
      required: false
      schema:
        example: test@run
        type: string
      style: form
    userId:
      description: The id of the user
      explode: false
      in: path
      name: userId
      required: true
      schema:
        type: string
      style: simple
    email:
      explode: false
      in: path
      name: email
      required: true
      schema:
        type: string
      style: simple
    queryTenantId:
      description: If exists will return the relevant resource for the tenant ID
      example: "1008"
      explode: true
      in: query
      name: tenantId
      required: false
      schema:
        default: ""
        type: string
      style: form
      x-internal: true
    appId:
      description: The application id to retrieve
      explode: false
      in: path
      name: appId
      required: true
      schema:
        type: string
      style: simple
    clientId:
      description: The client "id" to retrieve
      explode: false
      in: path
      name: id
      required: true
      schema:
        type: string
      style: simple
    realm:
      description: The name of the realm
      explode: false
      in: path
      name: realm
      required: true
      schema:
        type: string
      style: simple
    isHardDelete:
      description: Boolean indicator for soft/hard delete
      explode: true
      in: query
      name: isHardDelete
      required: false
      schema:
        type: boolean
      style: form
    settingsKey:
      description: The settings key
      explode: false
      in: path
      name: key
      required: true
      schema:
        $ref: '#/components/schemas/settingsKeyEnum'
      style: simple
    exchangeCode:
      description: The exchange code retrieved from the idp server
      explode: true
      in: query
      name: code
      required: true
      schema:
        type: string
      style: form
    redirectUri:
      description: The redirect uri to redirect to after the authorization server
        completes the authorization flow
      explode: true
      in: query
      name: redirect_uri
      required: true
      schema:
        type: string
      style: form
    refreshToken:
      description: The refresh token retrieved from the idp server
      explode: true
      in: query
      name: refresh_token
      required: true
      schema:
        type: string
      style: form
    appType:
      description: The type of application
      explode: true
      in: query
      name: appType
      required: true
      schema:
        enum:
        - Agent
        - MimirWriter
        type: string
      style: form
    code:
      $ref: '#/components/parameters/exchangeCode'
    redirect_url:
      $ref: '#/components/parameters/redirectUri'
    refresh_token:
      $ref: '#/components/parameters/refreshToken'
    app_type:
      $ref: '#/components/parameters/appType'
    is_hard_delete:
      $ref: '#/components/parameters/isHardDelete'
  responses:
    "500InternalServerError":
      content:
        application/json:
