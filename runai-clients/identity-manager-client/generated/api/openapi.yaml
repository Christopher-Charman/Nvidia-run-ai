  /api/v1/users:
    get:
      description: Retrieve a list of platform users.
      operationId: get_users
      parameters:
      - deprecated: true
        description: Filter results by user attribute.
        example: runai.is_local:true
        explode: true
        in: query
        name: filter
        required: false
        schema:
          type: string
        style: form
      - description: "Filter results by a parameter. Use the format field-name operator\
          \ value. Operators are <= Less than or equal, >= Greater than or equal,\
          \ =@ contains. Dates are in ISO 8601 timestamp format and available for\
          \ operators <=, >= and ==."
        explode: false
        in: query
        name: filterBy
        required: false
        schema:
          example:
          - "username=@test,lastLogin>=2024-09-24T00:00:00.00Z,isLocal==false"
          items:
            pattern: ^(username|createdBy|lastLogin|creationTime|lastUpdated|isLocal)(==|<=|>=|=@).+$
            type: string
          type: array
        style: form
      - description: Sort results by a parameters.
        explode: true
        in: query
        name: sortBy
        required: false
